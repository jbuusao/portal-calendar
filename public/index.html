<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app" data-testid="dummy-calendar">
      <header class="topbar">
        <div id="calendar-nav" class="calendar-nav">
          <button type="button" id="today-btn" class="today-btn">Today</button>
          <button type="button" id="prev-month" class="icon-btn" aria-label="Previous month">‹</button>
          <button type="button" id="next-month" class="icon-btn" aria-label="Next month">›</button>
          <h1 id="month-label" class="month-label"></h1>
          <span id="event-title-label" class="event-title-label"></span>
          <button type="button" id="events-toggle" class="events-toggle" aria-expanded="false" aria-controls="sidebar">
            Events
          </button>
          <button type="button" id="contacts-toggle" class="contacts-toggle" aria-expanded="false" aria-controls="contacts-dialog">
            Contacts
          </button>
          <div class="view-switcher">
            <button
              type="button"
              id="view-menu-btn"
              class="view-menu-btn"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="view-menu"
            >
              <span id="view-menu-label">Month</span>
              <span class="view-chevron" aria-hidden="true"></span>
            </button>
            <div id="view-menu" class="view-menu hidden" role="menu">
              <button type="button" class="view-option" role="menuitem" data-view="day">
                <span class="view-check" aria-hidden="true"></span>
                <span class="view-name">Day</span>
                <span class="view-shortcut">D</span>
              </button>
              <button type="button" class="view-option" role="menuitem" data-view="week">
                <span class="view-check" aria-hidden="true"></span>
                <span class="view-name">Week</span>
                <span class="view-shortcut">W</span>
              </button>
              <button type="button" class="view-option" role="menuitem" data-view="month">
                <span class="view-check" aria-hidden="true"></span>
                <span class="view-name">Month</span>
                <span class="view-shortcut">M</span>
              </button>
            </div>
          </div>
        </div>
        <label id="user-switcher" class="user-switcher">
          Acting as
          <select id="user-select"></select>
        </label>
        <div id="signed-in" class="signed-in hidden"></div>
      </header>
      <p id="error-banner" class="error-banner hidden"></p>
      <div id="view-calendar" class="workspace">
        <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-events">
            <div class="sidebar-header">
              <h2>Events</h2>
              <button type="button" id="sidebar-close" class="icon-btn sidebar-close" aria-label="Close events">×</button>
            </div>
            <ul id="event-list" class="event-list"></ul>
          </div>
          <div id="event-detail" class="event-detail"></div>
          <button type="button" id="lock-btn" class="lock-btn hidden">Confirm this slot</button>
          <p class="note" data-testid="dummy-calendar-note">
            Portal grants access to this app. Event invites are recorded here. Durable data is in
            <code>data/calendar.sqlite</code>.
          </p>
        </aside>
        <main class="main">
          <div id="grid" class="calendar-grid"></div>
        </main>
      </div>
    </div>
    <div id="day-menu" class="day-menu hidden" role="menu">
      <button type="button" id="menu-create-event" role="menuitem">Create event</button>
      <button type="button" id="menu-add-slot" role="menuitem" class="hidden"></button>
      <button type="button" id="menu-delete-slot" role="menuitem" class="hidden">Delete slot</button>
      <button type="button" id="menu-delete-event" role="menuitem" class="hidden"></button>
      <div id="menu-toggle-slot-sep" class="day-menu-sep hidden" role="separator"></div>
      <button type="button" id="menu-toggle-slot" role="menuitem" class="hidden"></button>
    </div>
    <div id="create-dialog" class="dialog-backdrop hidden">
      <form id="create-form" class="dialog" method="dialog">
        <h2 id="event-form-title">Create event</h2>
        <label>
          Name
          <input id="event-name" type="text" maxlength="80" required placeholder="Tennis match" autocomplete="off" />
        </label>
        <label>
          Description
          <textarea id="event-description" rows="2" maxlength="400" placeholder="Optional"></textarea>
        </label>
        <label>
          Venue
          <input id="event-venue" type="text" maxlength="80" placeholder="Optional" />
        </label>
        <div id="event-slot-fields">
          <div class="dialog-row">
            <label>
              Date
              <input id="event-date" type="date" required />
            </label>
            <label>
              Start
              <select id="event-start"></select>
            </label>
          </div>
          <div class="dialog-row">
            <label>
              Duration
              <select id="event-duration">
                <option value="30">30 minutes</option>
                <option value="60" selected>1 hour</option>
                <option value="90">1.5 hours</option>
                <option value="120">2 hours</option>
                <option value="180">3 hours</option>
                <option value="240">4 hours</option>
              </select>
            </label>
            <label>
              End
              <input id="event-end" type="text" readonly tabindex="-1" />
            </label>
          </div>
        </div>
        <fieldset id="invitee-fieldset" class="invitees">
          <legend id="invitee-legend">Invite from address book</legend>
          <input id="invite-contact-filter" type="search" placeholder="Search contacts" autocomplete="off" />
          <div id="invitee-options" class="invitee-options"></div>
        </fieldset>
        <label id="email-invite-label">
          Or invite by email
          <span class="email-add-row">
            <input id="invite-emails" type="text" placeholder="name@example.com" autocomplete="off" />
            <button type="button" id="invite-email-add" class="today-btn">Add</button>
          </span>
        </label>
        <div class="dialog-actions">
          <button type="button" id="create-cancel" class="today-btn">Cancel</button>
          <button type="submit" id="event-form-submit" class="add-btn">Create event</button>
        </div>
      </form>
    </div>
    <div id="delete-dialog" class="dialog-backdrop hidden">
      <div class="dialog" role="alertdialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-text">
        <h2 id="delete-dialog-title">Delete event?</h2>
        <p id="delete-dialog-text"></p>
        <div class="dialog-actions dialog-actions-stack">
          <button type="button" id="delete-notify" class="add-btn">Send cancellation emails and delete</button>
          <button type="button" id="delete-quiet" class="today-btn">Delete without sending cancellation emails</button>
          <button type="button" id="delete-abort" class="today-btn">Cancel</button>
        </div>
      </div>
    </div>
    <div id="contacts-dialog" class="dialog-backdrop hidden">
      <div class="dialog contacts-dialog" role="dialog" aria-labelledby="contacts-dialog-title">
        <div class="dialog-header">
          <h2 id="contacts-dialog-title">Address book</h2>
          <button type="button" id="contacts-close" class="icon-btn" aria-label="Close address book">×</button>
        </div>
        <p id="contacts-count" class="contacts-count"></p>
        <input id="contacts-search" type="search" placeholder="Search" autocomplete="off" />
        <ul id="contacts-list" class="contacts-list"></ul>
        <div class="dialog-actions">
          <button type="button" id="contact-add" class="add-btn">Add contact</button>
        </div>
      </div>
    </div>
    <div id="contact-form-dialog" class="dialog-backdrop hidden">
      <form id="contact-form" class="dialog" method="dialog">
        <h2 id="contact-form-title">Add contact</h2>
        <div class="dialog-row">
          <label>
            First name
            <input id="contact-first-name" type="text" maxlength="80" autocomplete="given-name" />
          </label>
          <label>
            Last name
            <input id="contact-last-name" type="text" maxlength="80" autocomplete="family-name" />
          </label>
        </div>
        <label>
          Nickname
          <input id="contact-nickname" type="text" maxlength="80" autocomplete="nickname" />
        </label>
        <label>
          Profile picture
          <input id="contact-picture" type="url" maxlength="500" placeholder="https:// (optional)" autocomplete="off" />
        </label>
        <fieldset class="invitees">
          <legend>Emails (up to 4)</legend>
          <input id="contact-email-0" type="email" required placeholder="name@example.com" autocomplete="off" />
          <input id="contact-email-1" type="email" placeholder="Optional" autocomplete="off" />
          <input id="contact-email-2" type="email" placeholder="Optional" autocomplete="off" />
          <input id="contact-email-3" type="email" placeholder="Optional" autocomplete="off" />
        </fieldset>
        <p id="contact-form-error" class="contact-form-error hidden"></p>
        <div class="dialog-actions dialog-actions-wrap">
          <button type="button" id="contact-delete" class="today-btn hidden">Delete</button>
          <button type="button" id="contact-form-cancel" class="today-btn">Cancel</button>
          <button type="submit" class="add-btn">Save</button>
        </div>
      </form>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
