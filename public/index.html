<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app" data-testid="dummy-calendar">
      <header class="topbar">
        <div id="calendar-nav" class="calendar-nav hidden">
          <button type="button" id="back-btn" class="today-btn">Back</button>
          <button type="button" id="today-btn" class="today-btn">Today</button>
          <button type="button" id="prev-month" class="icon-btn" aria-label="Previous month">‹</button>
          <button type="button" id="next-month" class="icon-btn" aria-label="Next month">›</button>
          <h1 id="month-label" class="month-label"></h1>
          <span id="event-title-label" class="event-title-label"></span>
          <div class="view-switcher">
            <button
              type="button"
              id="view-menu-btn"
              class="view-menu-btn"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="view-menu"
            >
              <span id="view-menu-label">Month</span>
              <span class="view-chevron" aria-hidden="true"></span>
            </button>
            <div id="view-menu" class="view-menu hidden" role="menu">
              <button type="button" class="view-option" role="menuitem" data-view="day">
                <span class="view-check" aria-hidden="true"></span>
                <span class="view-name">Day</span>
                <span class="view-shortcut">D</span>
              </button>
              <button type="button" class="view-option" role="menuitem" data-view="week">
                <span class="view-check" aria-hidden="true"></span>
                <span class="view-name">Week</span>
                <span class="view-shortcut">W</span>
              </button>
              <button type="button" class="view-option" role="menuitem" data-view="month">
                <span class="view-check" aria-hidden="true"></span>
                <span class="view-name">Month</span>
                <span class="view-shortcut">M</span>
              </button>
            </div>
          </div>
        </div>
        <h1 id="list-heading" class="month-label">Events</h1>
        <label id="user-switcher" class="user-switcher">
          Acting as
          <select id="user-select"></select>
        </label>
        <p id="signed-in" class="signed-in hidden"></p>
      </header>
      <p id="error-banner" class="error-banner hidden"></p>
      <div id="view-list" class="list-view">
        <form id="create-form" class="create-form">
          <label>
            Event title
            <input id="event-title" type="text" maxlength="80" required placeholder="Tennis match" />
          </label>
          <fieldset id="invitee-fieldset" class="invitees">
            <legend>Invite participants (simulated)</legend>
            <div id="invitee-options" class="invitee-options"></div>
          </fieldset>
          <label id="email-invite-label" class="hidden">
            Invite by email
            <input id="invite-emails" type="text" placeholder="bob@example.com, cara@example.com" />
          </label>
          <button type="submit" class="add-btn">Create event</button>
        </form>
        <ul id="event-list" class="event-list"></ul>
      </div>
      <div id="view-calendar" class="workspace hidden">
        <aside class="sidebar">
          <div class="mini-cal">
            <div id="mini-month-label" class="mini-month-label"></div>
            <div id="mini-grid" class="mini-grid"></div>
          </div>
          <div id="people" class="people"></div>
          <form id="suggest-form" class="add-form">
            <p id="selected-date-label" class="selected-date-label"></p>
            <label>
              Hour
              <select id="slot-hour"></select>
            </label>
            <button type="submit" class="add-btn">Suggest slot</button>
          </form>
          <button type="button" id="lock-btn" class="lock-btn hidden">Lock this slot</button>
          <p class="note" data-testid="dummy-calendar-note">
            Portal grants access to this app. Event invites are recorded here.             Durable data is in
            <code>data/calendar.sqlite</code>.
          </p>
        </aside>
        <main class="main">
          <div id="grid" class="calendar-grid"></div>
        </main>
      </div>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
